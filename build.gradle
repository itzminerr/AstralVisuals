plugins {
	id 'fabric-loom' version '1.11.8'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
		content {
			includeGroup 'io.github.ladysnake'
			includeGroup 'org.ladysnake'
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/accesswidener")
	mods {
		"astralvisuals" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.java.dev.jna:jna:5.13.0"
	implementation "net.java.dev.jna:jna-platform:5.13.0"

	// Satin — managed post-effect shaders (for Motion Blur). Bundled via JiJ so the standalone jar works.
	modImplementation "org.ladysnake:satin:3.0.0-alpha.1"
	include "org.ladysnake:satin:3.0.0-alpha.1"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-proc:none"]
}

tasks.register("updaterSmokeTest", JavaExec) {
	group = "verification"
	description = "Runs the live GitHub updater smoke test without touching the installed mod"
	dependsOn tasks.named("compileTestJava")
	classpath = sourceSets.test.output.classesDirs + sourceSets.main.output.classesDirs + configurations.testRuntimeClasspath
	mainClass = "pl.astralvisuals.utils.update.GitHubUpdaterSmokeTest"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
