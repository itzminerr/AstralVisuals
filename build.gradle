plugins {
	id 'fabric-loom' version '1.11.8'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
		content {
			includeGroup 'io.github.ladysnake'
			includeGroup 'org.ladysnake'
		}
	}
}

loom {
	accessWidenerPath = file("src/main/resources/accesswidener")
	mods {
		"astralvisuals" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.java.dev.jna:jna:5.13.0"
	implementation "net.java.dev.jna:jna-platform:5.13.0"

	// Satin — managed post-effect shaders (for Motion Blur). Bundled via JiJ so the standalone jar works.
	modImplementation "org.ladysnake:satin:3.0.0-alpha.1"
	include "org.ladysnake:satin:3.0.0-alpha.1"
}

sourceSets {
	installer {
		java.srcDir "src/installer/java"
		resources.srcDirs = []
	}
	test {
		compileClasspath += sourceSets.installer.output
		runtimeClasspath += sourceSets.installer.output
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-proc:none"]
}

tasks.register("installerJar", Jar) {
	group = "build"
	description = "Builds the standalone cross-platform pre-launch updater"
	dependsOn tasks.named("installerClasses")
	from sourceSets.installer.output
	archiveFileName = "astralinstaller.jar"
	destinationDirectory = layout.projectDirectory
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	manifest {
		attributes(
			"Main-Class": "pl.astralvisuals.installer.AstralInstaller",
			"Implementation-Title": "AstralVisuals Installer",
			"Implementation-Version": project.version
		)
	}
}

tasks.named("assemble") {
	dependsOn tasks.named("installerJar")
}

tasks.named("compileTestJava") {
	dependsOn tasks.named("compileInstallerJava")
}

tasks.register("installerSmokeTest", JavaExec) {
	group = "verification"
	description = "Tests the standalone installer against the live GitHub Release"
	dependsOn tasks.named("compileTestJava")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "pl.astralvisuals.installer.AstralInstallerSmokeTest"
}

tasks.register("soundOggSmokeTest", JavaExec) {
	group = "verification"
	description = "Stress-tests the HitSound OGG decoder and direct-buffer cleanup"
	dependsOn tasks.named("compileTestJava")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "pl.astralvisuals.utils.client.sound.SoundManagerOggSmokeTest"
}

tasks.register("mediaPlayerPerformanceTest", JavaExec) {
	group = "verification"
	description = "Stress-tests off-thread MediaPlayer artwork decoding and scaling"
	dependsOn tasks.named("compileTestJava")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "pl.astralvisuals.display.hud.MediaPlayerPerformanceTest"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
